<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bộ nam A — thử fit từng lớp</title><style>body{font:17px system-ui;background:#eee6da;color:#302b29;margin:24px}main{max-width:900px;margin:auto}.stage{position:relative;width:min(100%,540px);aspect-ratio:1080/1920;margin:auto}.stage img{position:absolute;width:100%;height:100%}label{display:inline-block;padding:12px}a{color:#244778}</style><main><h1>Bộ nam A — bản fit mới</h1><p>Chưa nghiệm thu. Nhân vật gốc + giày + quần + áo là bốn lớp PNG riêng. Bật/tắt để kiểm tra. Quần hiện giữ phom thẳng, chưa có nếp gấu như mẫu thẩm mỹ.</p><p>Kiểm cổ/vai, cổ tay và bàn tay, gấu quần/giày; xem cả kích thước nhỏ và phóng lớn.</p><div><label><input type="checkbox" checked data-layer="top">Áo</label><label><input type="checkbox" checked data-layer="bottom">Quần</label><label><input type="checkbox" checked data-layer="shoes">Giày</label></div><div class="stage"><img src="layers/base.png" alt="Nhân vật gốc"><img id="shoes" src="layers/shoes.png" alt="Giày"><img id="bottom" src="layers/bottom.png" alt="Quần"><img id="top" src="layers/top.png" alt="Áo"></div><p><a href="composite.png">PNG ghép trong suốt</a> · <a href="report.json">Thông số và nguồn</a></p></main><script>document.querySelectorAll('input').forEach(el=>el.onchange=()=>document.getElementById(el.dataset.layer).hidden=!el.checked)</script></html>
